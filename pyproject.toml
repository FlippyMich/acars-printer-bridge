[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acars-printer-bridge"
dynamic = ["version"]
description = "Print Fenix A32X ACARS/TELEX messages from MSFS on a Bluetooth thermal printer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "msfs",
    "flight-simulator",
    "fenix",
    "a320",
    "acars",
    "thermal-printer",
    "escpos",
    "cat-printer",
    "bluetooth",
    "ble",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Printing",
]
dependencies = [
    "bleak>=1.0",
    "pillow>=10.0",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/FlippyMich/acars-printer-bridge"
Repository = "https://github.com/FlippyMich/acars-printer-bridge"
Issues = "https://github.com/FlippyMich/acars-printer-bridge/issues"
Discord = "https://discord.gg/bFY5wCf6CK"

[project.scripts]
acars-bridge = "acars_bridge.cli:main"

[project.gui-scripts]
acars-bridge-ui = "acars_bridge.ui.app:launch"

[tool.setuptools]
packages = ["acars_bridge", "acars_bridge.ui"]

[tool.setuptools.dynamic]
version = { attr = "acars_bridge.__version__" }

[tool.setuptools.package-data]
"acars_bridge.ui" = ["assets/*.png", "assets/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
